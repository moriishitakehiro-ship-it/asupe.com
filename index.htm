<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>クセ強コミュニケーション診断</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #eef4ff, #fff7df);
      color: #222;
    }

    .container {
      max-width: 780px;
      margin: 40px auto;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 34px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.1);
    }

    .tag {
      display: inline-block;
      background: #222;
      color: #fff;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 34px;
      line-height: 1.35;
    }

    .lead {
      color: #444;
      font-size: 16px;
      line-height: 1.8;
    }

    .note {
      background: #fff4c2;
      border-left: 6px solid #f4c430;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      margin: 22px 0;
    }

    .progress {
      height: 10px;
      background: #e5e9f0;
      border-radius: 999px;
      overflow: hidden;
      margin: 24px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4f7cff, #ffb703);
      transition: 0.3s;
    }

    .question-number {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .question {
      font-size: 23px;
      font-weight: 800;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .sub {
      color: #666;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    button {
      border: none;
      cursor: pointer;
      font: inherit;
    }

    .option {
      background: #f6f8fc;
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      font-weight: 700;
      transition: 0.2s;
    }

    .option:hover {
      border-color: #4f7cff;
      background: #eef3ff;
      transform: translateY(-2px);
    }

    .result {
      display: none;
    }

    .score {
      font-size: 46px;
      font-weight: 900;
      color: #4f7cff;
      margin: 16px 0;
    }

    .result h2 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .result p {
      line-height: 1.9;
      color: #444;
    }

    .restart {
      margin-top: 20px;
      background: #222;
      color: #fff;
      padding: 13px 22px;
      border-radius: 999px;
      font-weight: 800;
    }

    .small {
      font-size: 13px;
      color: #666;
      margin-top: 20px;
    }

</head>
<body>

<div class="container">
  <div class="card">
    <span class="tag">ゆるめ・でも少し刺さる</span>

    <h1>クセ強コミュニケーション診断</h1>

    <p class="lead">
      「空気は読める。でも、たまにフォントサイズが小さすぎる。」<br>
      日常の会話・こだわり・感覚のクセを、ちょっとだけユーモラスに確認するセルフチェックです。
    </p>

    <div class="note">
      ※これは医療診断ではありません。アスペルガー症候群や自閉スペクトラム症を判定するものではなく、自己理解のための参考ツールです。毎回70問の中からランダムで5問だけ出題されます。
    </div>

    <div id="quiz">
      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div id="questionNumber" class="question-number"></div>
      <div id="questionText" class="question"></div>
      <div id="questionSub" class="sub"></div>
      <div id="options" class="options"></div>
    </div>

    <div id="result" class="result">
      <h2 id="resultTitle"></h2>
      <div id="score" class="score"></div>
      <p id="resultComment"></p>

      <button class="restart" onclick="restartQuiz()">もう一度チェックする</button>

      <p class="small">
        結果はあくまで参考です。困りごとが生活や仕事に強く影響している場合は、専門機関への相談も検討してください。
      </p>
    </div>
  </div>
</div>

  const QUESTION_COUNT = 5;

  let questions = [];
  let current = 0;
  let totalScore = 0;

  const quiz = document.getElementById("quiz");
  const result = document.getElementById("result");
  const progressBar = document.getElementById("progressBar");
  const questionNumber = document.getElementById("questionNumber");
  const questionText = document.getElementById("questionText");
  const questionSub = document.getElementById("questionSub");
  const options = document.getElementById("options");
  const resultTitle = document.getElementById("resultTitle");
  const score = document.getElementById("score");
  const resultComment = document.getElementById("resultComment");

  function shuffleArray(array) {
    const copied = [...array];

    for (let i = copied.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copied[i], copied[j]] = [copied[j], copied[i]];
    }

    return copied;
  }

  function startQuiz() {
    questions = shuffleArray(allQuestions).slice(0, QUESTION_COUNT);
    current = 0;
    totalScore = 0;
    result.style.display = "none";
    quiz.style.display = "block";
    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[current];

    questionNumber.textContent = `質問 ${current + 1} / ${questions.length}`;
    questionText.textContent = q.text;
    questionSub.textContent = q.sub;
    options.innerHTML = "";

    progressBar.style.width = `${(current / questions.length) * 100}%`;

    q.options.forEach(option => {
      const btn = document.createElement("button");
      btn.className = "option";
      btn.textContent = option.label;

      btn.onclick = () => {
        totalScore += option.point;
        current++;

        if (current < questions.length) {
          renderQuestion();
        } else {
          showResult();
        }
      };

      options.appendChild(btn);
    });
  }

  function showResult() {
    quiz.style.display = "none";
    result.style.display = "block";
    progressBar.style.width = "100%";

    const maxScore = questions.length * 2;
    const percent = Math.round((totalScore / maxScore) * 100);

    score.textContent = `${percent}%`;

    if (percent <= 30) {
      resultTitle.textContent = "空気スイスイ型";
      resultComment.textContent =
        "場の流れに乗るのが比較的得意なタイプです。相手の反応を見ながら柔軟に動ける一方で、周囲に合わせすぎて自分の疲れに気づきにくいこともあります。たまには自分の取扱説明書も読んであげましょう。";
    } else if (percent <= 65) {
      resultTitle.textContent = "確認したい設計士型";
      resultComment.textContent =
        "あいまいなことを整理したり、ズレを減らしたりする力がありそうです。『細かい人』ではなく、事故を未然に防ぐ人です。ただし、全部を設計図にしようとすると疲れるので、少しだけ“まあいっか”の余白も持てると楽になります。";

      resultTitle.textContent = "解像度高め職人型";

    }
  }
